version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL 8 chính thức
  mysql:
    image: mysql:8.0
    container_name: blog_cms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blog_cms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Máy chủ Backend API (Node.js LTS + Express + Prisma + Prometheus Metrics)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog_cms_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:rootpassword@mysql:3306/blog_cms"
      JWT_SECRET: "ictu_blog_cms_super_secret_jwt_key_2026_vu_trong_nghia"
      JWT_EXPIRES_IN: "7d"
      COOKIE_SECRET: "ictu_cookie_secret_key_k23l"
      FRONTEND_URL: "http://localhost:3000"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Máy chủ giao diện Frontend (React + Vite + Tailwind CSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog_cms_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 4. Prometheus - Thu thập chỉ số hiệu năng và trạng thái hệ thống
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: blog_cms_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  # 5. Grafana - Trực quan hóa Dashboard giám sát chỉ số (Triển khai & Vận hành phần mềm)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: blog_cms_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana-dashboards/blog-cms-dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql_data:
  uploads_data:
  prometheus_data:
  grafana_data:
